name: experiment

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The suite already re-runs every sweep, but running the shipped entry
      # point separately proves the command in the README works and that the
      # report and figure can be produced from a clean checkout.
      - name: Run the experiment
        run: python examples/run_experiment.py --out out

      - uses: actions/upload-artifact@v4
        with:
          name: reports-and-figures-py${{ matrix.python-version }}
          path: out/
          if-no-files-found: error
