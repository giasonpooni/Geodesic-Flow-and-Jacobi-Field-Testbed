name: verify

# Five jobs, each running its work once.
#
# The previous layout ran the full suite on three interpreters and again under
# the locked resolution, then both experiment stages on each of those three,
# then the reference report three times. The expensive part is the science --
# a full stage is minutes -- and running it four times over says nothing the
# first run did not, because the answer does not depend on the interpreter.
# What *does* depend on the interpreter is the contract layer: imports, dataclass
# behaviour, tomllib, typing. So the split is by what varies, not by what costs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Everything except the experiment stages and the perturbation sweeps.
      # These are the tests whose outcome an interpreter version can change.
      - name: Contracts, schemas and unit tests
        run: pytest -q -m "not numerical"

  numerical:
    name: numerical suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Once, on one interpreter. The committed-artefact comparison, the two
      # experiment stages and the validity probes live here.
      - name: The scientific suite
        run: pytest -q -m numerical --durations=10

  artefacts:
    name: artefact verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Proves the commands in the README work from a clean checkout and that
      # every declared check passes when the artefacts are rebuilt. Once.
      - name: Regenerate both stages and the reference report
        run: |
          python examples/run_experiment.py --out out
          python examples/write_reference_report.py --out out
      - uses: actions/upload-artifact@v4
        with:
          name: reports-and-figures
          path: out/
          if-no-files-found: error

  wheel:
    name: wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The version is dynamic: hatchling reads RUNTIME_VERSION out of
      # engine/contract.py at build time. An editable install exercises a
      # different metadata path from the wheel a user receives, so the thing
      # worth checking is the wheel -- built, installed into an empty
      # environment, and asked what version it thinks it is.
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment and interrogate it
        run: |
          python -m venv wheel-test
          wheel-test/bin/pip install --upgrade pip
          wheel-test/bin/pip install dist/*.whl
          wheel-test/bin/python - <<'PY'
          import geodesic_testbed as g
          from importlib.metadata import version
          built = version("curved-surface-geodesic-sensitivity")
          assert g.__version__ == g.RUNTIME_VERSION == built, (
              g.__version__, g.RUNTIME_VERSION, built
          )
          # A wheel that imports but ships no package data is still broken.
          from geodesic_testbed.boundary import PathGeometryArtefact, TransferRecord
          print(f"wheel {built} imports and carries the boundary types")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  determinism:
    name: end-to-end determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Each cycle runs every shipped entry point with a different hash seed, a
      # different BLAS thread count and a different working directory, and
      # asserts the artefacts do not move.
      #
      # Two cycles on a pull request, five on the default branch: the failure
      # this catches is a dependence on one of those three things, and two
      # cycles already vary all three. More cycles buy confidence, not
      # coverage, so they are spent where a red build blocks nothing.
      #
      # --baseline self, not committed: the tracked reports were generated by a
      # different numpy build, and the last digits of sin, cosh, svd and every
      # BLAS reduction belong to the platform's libm. "Matches the committed
      # bytes" is not a claim that can hold on a runner; "every cycle agrees
      # with the first" is, and it is the one this job makes.
      - name: Repeat the pipeline and require the bytes to agree
        run: >-
          python tools/e2e.py
          --runs ${{ github.ref == 'refs/heads/main' && 5 || 2 }}
          --profile fast --baseline self --report e2e-determinism.json

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-determinism
          path: e2e-determinism.json
          if-no-files-found: error

  locked:
    name: locked resolution (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails if uv.lock does not match pyproject.toml, so a
      # dependency change that was not locked cannot merge. The contract tests
      # are enough here: this job is about resolution, and the numerical suite
      # has already run once against the same code.
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q -m "not numerical"
