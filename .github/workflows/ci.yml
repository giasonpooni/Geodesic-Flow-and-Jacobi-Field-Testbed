name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The suite already re-runs every sweep, but running the shipped entry
      # points separately proves the commands in the README work from a clean
      # checkout and that the artefacts can be rebuilt.
      - name: Run both experiment stages
        run: python examples/run_experiment.py --out out

      - name: Rebuild the application reference report
        run: python examples/write_reference_report.py

      - uses: actions/upload-artifact@v4
        with:
          name: reports-and-figures-py${{ matrix.python-version }}
          path: out/
          if-no-files-found: error

  determinism:
    name: end-to-end determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Each cycle runs every shipped entry point with a different hash seed, a
      # different BLAS thread count and a different working directory, and
      # asserts the artefacts do not move.
      #
      # --baseline self, not committed: the tracked reports were generated by a
      # different numpy build, and the last digits of sin, cosh, svd and every
      # BLAS reduction belong to the platform's libm. "Matches the committed
      # bytes" is therefore not a claim that can hold on a runner. "Every cycle
      # agrees with the first" is, and it is the one this job exists to make.
      - name: Repeat the pipeline and require the bytes to agree
        run: >-
          python tools/e2e.py --runs 5 --profile fast
          --baseline self --report e2e-determinism.json

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-determinism
          path: e2e-determinism.json
          if-no-files-found: error

  locked:
    name: locked resolution (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails if uv.lock does not match pyproject.toml, so a
      # dependency change that was not locked cannot merge.
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
