[project]
name = "curved-surface-geodesic-sensitivity"
dynamic = ["version"]
description = "Curvature-aware path sensitivity: geodesic flow, Jacobi transfer maps, and first-order tolerance contracts for curved-surface manufacturing and robotic inspection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "giasonpooni" }]
keywords = [
  "differential-geometry",
  "geodesics",
  "jacobi-fields",
  "path-planning",
  "tolerance-analysis",
  "numerical-analysis",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
figure = ["matplotlib>=3.8"]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/giasonpooni/Curved-Surface-Geodesic-Sensitivity-Runtime"

[project.scripts]
geodesic-sensitivity-experiment = "geodesic_testbed.engine.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geodesic_testbed"]

# The version is declared once, in engine/contract.py, and read from there:
# a literal here as well would be a second source of truth that drifts, and
# did -- 0.2.0 against the 0.1.0 both reports carried.
[tool.hatch.version]
path = "src/geodesic_testbed/engine/contract.py"
pattern = 'RUNTIME_VERSION = "(?P<version>[^"]+)"'

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# ``numerical`` marks the tests that run the science rather than the
# contracts: the experiment stages, the committed-artefact comparison and the
# validity probes. They are the same tests either way -- the marker exists so
# CI can run them once on one interpreter instead of four times, not so that
# anyone can skip them.
markers = [
  "numerical: runs a full experiment stage or a perturbation sweep (minutes, not seconds)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
