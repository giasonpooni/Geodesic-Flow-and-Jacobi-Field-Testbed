[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geojac"
version = "0.1.0"
description = "Geodesic flow and Jacobi-field testbed on the three constant-curvature surfaces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "giasonpooni" }]
keywords = ["differential-geometry", "geodesics", "jacobi-fields", "numerical-analysis"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
figure = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=7.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/giasonpooni/Geodesic-Flow-and-Jacobi-Field-Testbed"

[project.scripts]
geojac-experiment = "geojac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
