[project]
name = "curved-surface-geodesic-sensitivity"
version = "0.2.0"
description = "Curvature-aware path sensitivity: geodesic flow, Jacobi transfer maps, and first-order tolerance contracts for curved-surface manufacturing and robotic inspection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "giasonpooni" }]
keywords = [
  "differential-geometry",
  "geodesics",
  "jacobi-fields",
  "path-planning",
  "tolerance-analysis",
  "numerical-analysis",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
figure = ["matplotlib>=3.8"]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/giasonpooni/Curved-Surface-Geodesic-Sensitivity-Runtime"

[project.scripts]
geodesic-sensitivity-experiment = "geodesic_testbed.engine.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geodesic_testbed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
